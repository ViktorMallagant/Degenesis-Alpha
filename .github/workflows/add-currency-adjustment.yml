name: Add currency adjustment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-currency-adjustment.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add persistent Drafts and Dinars adjustment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          store = Path('src/store/index.ts')
          replace_once(
              store,
              """  manualLC: number | null
  expertLCModified: boolean
""",
              """  manualLC: number | null
  lcAdjustment: number
  expertLCModified: boolean
""",
              'state currency adjustment',
          )
          replace_once(
              store,
              """    manualLC: null,
    expertLCModified: false,
""",
              """    manualLC: null,
    lcAdjustment: 0,
    expertLCModified: false,
""",
              'default currency adjustment',
          )
          replace_once(
              store,
              """        state.imposteurCultName,
        state.renegadeCultNames.length > 0 ? state.renegadeCultNames : undefined,
      )
""",
              """        state.imposteurCultName,
        state.renegadeCultNames.length > 0 ? state.renegadeCultNames : undefined,
        state.lcAdjustment || undefined,
      )
""",
              'export currency adjustment',
          )
          replace_once(
              store,
              """      const landlordBonus = this.hasLandlord ? 1000 : 0
      return base + landlordBonus - this.spentLC
""",
              """      const landlordBonus = this.hasLandlord ? 1000 : 0
      return base + landlordBonus + this.lcAdjustment - this.spentLC
""",
              'apply currency adjustment',
          )
          replace_once(
              store,
              """      this.manualLC = character.manualLC ?? null
      this.legacyChoices = character.legacyChoices ? { ...character.legacyChoices } : {}
""",
              """      this.manualLC = character.manualLC ?? null
      this.lcAdjustment = character.lcAdjustment ?? 0
      this.legacyChoices = character.legacyChoices ? { ...character.legacyChoices } : {}
""",
              'load currency adjustment',
          )
          replace_once(
              store,
              """    setManualLC(value: number | null) {
      this.manualLC = value
      if (this.editorMode === EditorMode.Free) {
        this.expertLCModified = true
      }
    },
""",
              """    setManualLC(value: number | null) {
      this.manualLC = value
      if (this.editorMode === EditorMode.Free) {
        this.expertLCModified = true
      }
    },
    setLCAdjustment(value: number | null) {
      this.lcAdjustment = value !== null && Number.isFinite(value) ? value : 0
    },
""",
              'currency adjustment action',
          )

          character = Path('src/store/character.ts')
          replace_once(
              character,
              """    readonly imposteurCultName?: string | null,
    readonly renegadeCultNames?: string[],
  ) {
""",
              """    readonly imposteurCultName?: string | null,
    readonly renegadeCultNames?: string[],
    readonly lcAdjustment?: number,
  ) {
""",
              'character currency adjustment',
          )

          editor = Path('src/components/EditorTab.vue')
          replace_once(
              editor,
              """                            <v-col cols="6" sm="2">
                              <v-tooltip
                                :text="$t('messages.lcNegativeTooltip')"
                                :disabled="store.remainingLC >= 0"
                                location="bottom"
                              >
                                <template v-slot:activator="{ props }">
                                  <v-text-field
                                    v-if="store.editorMode === 'free'"
                                    v-bind="props"
                                    :model-value="store.remainingLC"
                                    :label="$t('messages.dinars')"
                                    variant="underlined"
                                    type="number"
                                    :error="store.remainingLC < 0"
@update:model-value="val => { const bonus = store.hasLandlord ? 1000 : 0; store.setManualLC(val === '' || val === null ? null : Number(val) - bonus + store.spentLC) }"
                                  ></v-text-field>
                                  <v-text-field
                                    v-else
                                    v-bind="props"
                                    :model-value="store.computedDinars ? `${store.remainingLC} ${store.computedDinars.currency}` : ''"
                                    :label="$t('messages.dinars')"
                                    variant="underlined"
                                    :error="store.remainingLC < 0"
                                    readonly
                                  ></v-text-field>
                                </template>
                              </v-tooltip>
                            </v-col>
""",
              """                            <v-col cols="6" sm="2">
                              <div class="d-flex align-start currency-fields">
                                <v-tooltip
                                  :text="$t('messages.lcNegativeTooltip')"
                                  :disabled="store.remainingLC >= 0"
                                  location="bottom"
                                >
                                  <template v-slot:activator="{ props }">
                                    <v-text-field
                                      v-if="store.editorMode === 'free'"
                                      v-bind="props"
                                      :model-value="store.remainingLC"
                                      :label="$t('messages.dinars')"
                                      variant="underlined"
                                      type="number"
                                      class="currency-total-field"
                                      :error="store.remainingLC < 0"
                                      @update:model-value="val => { const bonus = store.hasLandlord ? 1000 : 0; store.setManualLC(val === '' || val === null ? null : Number(val) - bonus - store.lcAdjustment + store.spentLC) }"
                                    ></v-text-field>
                                    <v-text-field
                                      v-else
                                      v-bind="props"
                                      :model-value="store.computedDinars ? `${store.remainingLC} ${store.computedDinars.currency}` : ''"
                                      :label="$t('messages.dinars')"
                                      variant="underlined"
                                      class="currency-total-field"
                                      :error="store.remainingLC < 0"
                                      readonly
                                    ></v-text-field>
                                  </template>
                                </v-tooltip>
                                <v-tooltip
                                  text="Adds to or subtracts from the automatic Drafts/Dinars total."
                                  location="bottom"
                                >
                                  <template v-slot:activator="{ props: adjustmentProps }">
                                    <v-text-field
                                      v-bind="adjustmentProps"
                                      :model-value="store.lcAdjustment"
                                      label="±"
                                      variant="underlined"
                                      type="number"
                                      class="currency-adjustment-field ml-2"
                                      @update:model-value="val => store.setLCAdjustment(val === '' || val === null ? 0 : Number(val))"
                                    ></v-text-field>
                                  </template>
                                </v-tooltip>
                              </div>
                            </v-col>
""",
              'editor currency fields',
          )
          replace_once(
              editor,
              """#appBarIcon {
  width: 4em;
}
""",
              """#appBarIcon {
  width: 4em;
}

.currency-fields {
  min-width: 0;
}

.currency-total-field {
  flex: 1 1 auto;
  min-width: 0;
}

.currency-adjustment-field {
  flex: 0 0 64px;
  max-width: 64px;
}
""",
              'editor currency field styles',
          )

          inventory = Path('src/components/InventoryTab.vue')
          replace_once(
              inventory,
              """          @change="e => { const v = (e.target as HTMLInputElement).value; const bonus = store.hasLandlord ? 1000 : 0; store.setManualLC(v === '' ? null : Number(v) - bonus + store.spentLC) }"
""",
              """          @change="e => { const v = (e.target as HTMLInputElement).value; const bonus = store.hasLandlord ? 1000 : 0; store.setManualLC(v === '' ? null : Number(v) - bonus - store.lcAdjustment + store.spentLC) }"
""",
              'free-mode inventory total',
          )
          replace_once(
              inventory,
              """        <span v-if="store.editorMode !== 'free'" class="inv-stat-sub inv-muted">(base : {{ store.computedDinars?.value ?? 0 }})</span>
      </div>
""",
              """        <span v-if="store.editorMode !== 'free'" class="inv-stat-sub inv-muted">(base : {{ store.computedDinars?.value ?? 0 }})</span>
        <label class="inv-lc-adjustment" title="Adds to or subtracts from the automatic Drafts/Dinars total.">
          <span class="inv-stat-sub inv-muted">±</span>
          <input
            type="number"
            :value="store.lcAdjustment"
            @change="e => store.setLCAdjustment(Number((e.target as HTMLInputElement).value) || 0)"
            class="inv-lc-adjustment-input"
          />
        </label>
      </div>
""",
              'inventory adjustment control',
          )
          replace_once(
              inventory,
              """.inv-lc-inline-input:focus {
  border-bottom-color: rgb(var(--v-theme-primary));
}

.inv-stat-sub {
""",
              """.inv-lc-inline-input:focus {
  border-bottom-color: rgb(var(--v-theme-primary));
}

.inv-lc-adjustment {
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
}

.inv-lc-adjustment-input {
  width: 58px;
  color: rgb(var(--v-theme-on-surface));
  background: transparent;
  border: none;
  border-bottom: 1px dashed rgba(var(--v-theme-on-surface), 0.4);
  outline: none;
  text-align: center;
  -moz-appearance: textfield;
}

.inv-lc-adjustment-input::-webkit-inner-spin-button,
.inv-lc-adjustment-input::-webkit-outer-spin-button {
  -webkit-appearance: none;
}

.inv-lc-adjustment-input:focus {
  border-bottom-color: rgb(var(--v-theme-primary));
}

.inv-stat-sub {
""",
              'inventory adjustment styles',
          )

          tests = Path('tests/store/importExport.spec.ts')
          replace_once(
              tests,
              """  expect(character.editorMode).toEqual(EditorMode.Free)
})
""",
              """  expect(character.editorMode).toEqual(EditorMode.Free)
  expect(character.lcAdjustment).toEqual(125)
})
""",
              'export adjustment assertion',
          )
          replace_once(
              tests,
              """  expect(store.editorMode).toEqual(EditorMode.Default)

  expect(store.potentials).toEqual(new Map())
""",
              """  expect(store.editorMode).toEqual(EditorMode.Default)
  expect(store.lcAdjustment).toEqual(0)

  expect(store.potentials).toEqual(new Map())
""",
              'backward compatibility assertion',
          )
          replace_once(
              tests,
              """  store.setPotential(Asceticism, 2)

  store.age = 'test age'
""",
              """  store.setPotential(Asceticism, 2)
  store.setLCAdjustment(125)

  store.age = 'test age'
""",
              'sample adjustment',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run store tests
        run: npx vitest run tests/store/importExport.spec.ts

      - name: Lint changed files
        run: npx eslint src/store/index.ts src/store/character.ts src/components/EditorTab.vue src/components/InventoryTab.vue tests/store/importExport.spec.ts

      - name: Build production site
        run: npm run build-only

      - name: Check whitespace
        run: git diff --check

      - name: Commit currency adjustment
        run: |
          rm -f .github/workflows/add-currency-adjustment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add editable currency adjustment"
          git push
