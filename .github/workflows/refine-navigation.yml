name: Refine navigation and app state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-navigation.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refine navigation and utility state
        run: node .github/scripts/refine-navigation.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint app shell
        run: npx eslint src/App.vue

      - name: Build production site
        run: npm run build-only

      - name: Check whitespace
        run: git diff --check

      - name: Commit refined navigation
        run: |
          rm -f .github/workflows/refine-navigation.yml .github/scripts/refine-navigation.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add timeline link and streamline navigation"
          git push
