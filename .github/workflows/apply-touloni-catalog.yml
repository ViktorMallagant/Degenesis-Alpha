name: Apply Touloni catalog update

on:
  push:
    branches: [main]
    paths:
      - '.github/touloni-update.trigger'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Touloni descriptions
        run: node .github/scripts/apply-touloni.mjs

      - name: Commit catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/messages/clans/catalog.ts
          if git diff --cached --quiet; then
            echo "No catalog changes needed."
          else
            git commit -m "Add Touloni clan descriptions"
            git push
          fi
